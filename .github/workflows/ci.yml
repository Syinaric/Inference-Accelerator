name: RTL Regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          iverilog -V | head -1

      - name: Install cocotb
        run: pip install cocotb==2.0.1

      - name: Run DEPTH sweep
        run: make sweep

      - name: pe sweep
        run: make sweep-pe

      - name: Golden model self-tests
        run: |
          PYTHONPATH=systolic_array/model python systolic_array/model/pe_model.py
          PYTHONPATH=systolic_array/model python systolic_array/model/systolic_array_model.py

      - name: systolic array sweep
        run: make sweep-array

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cocotb-results
          path: '**/results.xml'
          